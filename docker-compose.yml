# =====================================================================
#  Autello — инфраструктура MVP «докеризированный монолит» (Кейс 3, ч.1 + ч.2)
#  Запуск:  docker compose up -d   (именно плагин `docker compose`, не docker-compose)
#
#  Сети:
#    public   — то, что смотрит наружу: nginx, registry, registry-ui, pgadmin
#    internal — изолированная (internal: true, без выхода в интернет):
#               postgres, backend, а также pgadmin и nginx (они в обеих сетях)
#  Наружу публикуются только: nginx (HTTP_PORT), registry (REGISTRY_PORT, с логином),
#  registry-ui (REGISTRY_UI_PORT), pgadmin (PGADMIN_PORT). PostgreSQL и backend — НЕТ.
#
#  Профиль tools (не стартует при обычном up):
#    docker compose --profile tools run --rm frontend-build   — сборка фронта без Node.js на хосте
#    docker compose --profile tools run --rm e2e              — браузерный тест формы (Playwright)
# =====================================================================

services:

  # --- База данных: только внутренняя сеть, порт не публикуется ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL из этой папки выполняется один раз — при первом создании тома pgdata
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # ports: НЕТ — намеренно. Доступ только из сети internal.

  # --- pgAdmin: веб-интерфейс к БД. Стоит в обеих сетях: принимает браузер из public,
  #     ходит в postgres через internal ---
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Сервер Postgres заранее прописан — сразу виден в дереве слева
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - public
      - internal

  # --- Локальный Docker Registry с htpasswd-аутентификацией ---
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Autello Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "${REGISTRY_PORT}:5000"
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      # htpasswd создаётся скриптом registry/create-user.sh
      - ./registry/auth:/auth:ro
    networks:
      - public

  # --- Веб-интерфейс реестра: «реестр доступен в браузере» ---
  registry-ui:
    image: joxit/docker-registry-ui:latest
    restart: unless-stopped
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "Autello Registry"
      # UI проксирует запросы к реестру сам — CORS не нужен. Без завершающего слэша!
      NGINX_PROXY_PASS_URL: http://registry:5000
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    ports:
      - "${REGISTRY_UI_PORT}:80"
    depends_on:
      - registry
    networks:
      - public

  # --- Nginx: статика frontend/dist + прокси /api/ (и /docs при DOCS_ENABLED=true) на backend ---
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    environment:
      # Выбор шаблона docs_true/docs_false в nginx/templates/docs
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:-8000}
      # envsubst подставляет ТОЛЬКО эти переменные — $host, $uri и т.п. остаются nginx-переменными
      NGINX_ENVSUBST_FILTER: "^(DOCS_ENABLED|BACKEND_INTERNAL_PORT)$$"
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      # Шаблоны → /etc/nginx/conf.d/ (через envsubst при старте). conf.d НЕ монтируем: туда пишет entrypoint
      - ./nginx/templates:/etc/nginx/templates:ro
      # Результат `npm run build`
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - public
      # Во внутренней сети nginx видит backend по имени backend:8000
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # --- Watchtower: автообновление контейнеров с меткой watchtower.enable=true ---
  # Форк nickfedor/watchtower: оригинальный containrrr/watchtower заархивирован
  # (17.12.2025, v1.7.1) и не работает с Docker Engine 29+ (старый API 1.25).
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      # Обновлять ТОЛЬКО контейнеры с меткой — postgres автоматически не трогаем
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL}
      WATCHTOWER_CLEANUP: "true"
      TZ: Europe/Moscow
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Логин в локальный реестр (после `docker login`). На VPS это /root/.docker/config.json
      - ${HOME}/.docker/config.json:/config.json:ro
    networks:
      - public

  # --- Backend: FastAPI. Только сеть internal, БЕЗ ports — снаружи доступен лишь через nginx /api/ ---
  backend:
    build: ./backend
    image: ${REGISTRY_HOST}:${REGISTRY_PORT}/autello-backend:latest
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Имя сервиса БД во внутренней сети
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Healthcheck описан в backend/Dockerfile: GET /api/health (внутри — SELECT 1 к БД)

  # ===================== Профиль tools: разовые служебные контейнеры =====================

  # Сборка фронтенда, если на машине нет Node.js («npm: command not found» из урока)
  frontend-build:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      # node_modules контейнера (Linux) не смешиваем с node_modules хоста
      - /app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

  # Браузерный тест формы + скриншоты для сдачи → reports/screens/
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: ["tools"]
    working_dir: /e2e
    environment:
      BASE_URL: http://nginx
      SCREENS_DIR: /reports/screens
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      CI: "1"
    volumes:
      - ./scripts/e2e:/e2e
      - /e2e/node_modules
      - ./reports:/reports
    networks:
      - public
    command: sh -c "npm ci --no-audit --no-fund --loglevel=error && npx playwright test"

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  pgadmin-data:
  registry-data:
