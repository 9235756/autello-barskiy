# =====================================================================
#  Autello — «докеризированный монолит» (Кейс 3, части 1–3)
#
#  ЭТОТ ФАЙЛ = ЗАЩИЩЁННЫЙ РЕЖИМ (make secure или просто `docker compose up --build -d`):
#    наружу публикует порты ТОЛЬКО nginx:
#      80   → 301 на https
#      443  → сайт (TLS 1.2+, HTTP/2, HSTS)
#      8000 → 403 (имитация закрытого порта backend, сам backend не опубликован)
#      5432 → 403 (имитация закрытого порта PostgreSQL, сама БД не опубликована)
#    pgadmin, registry, registry-ui — в профиле admin-tools и НЕ запускаются.
#    Swagger (/docs, /openapi.json) выключен: DOCS_ENABLED=false → 404.
#
#  РЕЖИМ РАЗРАБОТКИ (make dev) = этот файл + docker-compose.dev.yml + профиль admin-tools:
#    COMPOSE_PROFILES=admin-tools docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
#  Сети:
#    public   — то, что смотрит наружу: nginx, registry, registry-ui, pgadmin
#    internal — изолированная (internal: true, без выхода в интернет):
#               postgres, backend, а также pgadmin и nginx (они в обеих сетях)
#
#  Профиль tools (разовые контейнеры):
#    docker compose --profile tools run --rm frontend-build   — сборка фронта без Node.js на хосте
#    docker compose --profile tools run --rm e2e              — Playwright: e2e-тесты и скриншоты
# =====================================================================

services:

  # --- База данных: только внутренняя сеть, порт не публикуется ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL из этой папки выполняется один раз — при первом создании тома pgdata
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # ports: НЕТ — намеренно. Доступ только из сети internal.

  # --- pgAdmin: веб-интерфейс к БД. Стоит в обеих сетях: принимает браузер из public,
  #     ходит в postgres через internal ---
  pgadmin:
    image: dpage/pgadmin4:latest
    # Только в dev-режиме (COMPOSE_PROFILES=admin-tools). В secure не запускается
    profiles: ["admin-tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Сервер Postgres заранее прописан — сразу виден в дереве слева
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - public
      - internal

  # --- Локальный Docker Registry с htpasswd-аутентификацией ---
  registry:
    image: registry:2
    # Только в dev-режиме (COMPOSE_PROFILES=admin-tools). В secure не запускается
    profiles: ["admin-tools"]
    restart: unless-stopped
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Autello Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "${REGISTRY_PORT}:5000"
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      # htpasswd создаётся скриптом registry/create-user.sh
      - ./registry/auth:/auth:ro
    networks:
      - public

  # --- Веб-интерфейс реестра: «реестр доступен в браузере» ---
  registry-ui:
    image: joxit/docker-registry-ui:latest
    # Только в dev-режиме (COMPOSE_PROFILES=admin-tools). В secure не запускается
    profiles: ["admin-tools"]
    restart: unless-stopped
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "Autello Registry"
      # UI проксирует запросы к реестру сам — CORS не нужен. Без завершающего слэша!
      NGINX_PROXY_PASS_URL: http://registry:5000
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    ports:
      - "${REGISTRY_UI_PORT}:80"
    depends_on:
      - registry
    networks:
      - public

  # --- Nginx: единственный сервис с опубликованными портами в secure-режиме ---
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    environment:
      # secure: 80 → 301, заглушки 403 на 8000/5432. В dev (docker-compose.dev.yml) — dev
      NGINX_MODE: secure
      # Swagger закрыт: /docs и /openapi.json → 404
      DOCS_ENABLED: "false"
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:-8000}
      # envsubst подставляет ТОЛЬКО эти переменные — $host, $uri и т.п. остаются nginx-переменными
      NGINX_ENVSUBST_FILTER: "^(DOCS_ENABLED|BACKEND_INTERNAL_PORT|NGINX_MODE)$$"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # Имитация закрытых портов: nginx отвечает 403 (см. nginx/templates/modes/secure.conf.template)
      - "${STUB_BACKEND_PORT:-8000}:8000"
      - "${STUB_POSTGRES_PORT:-5432}:5432"
    volumes:
      # Шаблоны → /etc/nginx/conf.d/ (через envsubst при старте). conf.d НЕ монтируем: туда пишет entrypoint
      - ./nginx/templates:/etc/nginx/templates:ro
      # Результат `npm run build`
      - ./frontend/dist:/usr/share/nginx/html:ro
      # TLS: самоподписанный (make certs) или Let's Encrypt (scripts/letsencrypt.sh)
      - ${SSL_CERT_PATH:-./nginx/certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_KEY_PATH:-./nginx/certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
      # Webroot для проверки Let's Encrypt (/.well-known/acme-challenge/)
      - ./nginx/certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - public
      # Во внутренней сети nginx видит backend по имени backend:8000
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # --- Watchtower: автообновление контейнеров с меткой watchtower.enable=true ---
  # Форк nickfedor/watchtower: оригинальный containrrr/watchtower заархивирован
  # (17.12.2025, v1.7.1) и не работает с Docker Engine 29+ (старый API 1.25).
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      # Обновлять ТОЛЬКО контейнеры с меткой — postgres автоматически не трогаем
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL}
      WATCHTOWER_CLEANUP: "true"
      TZ: Europe/Moscow
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Логин в локальный реестр (после `docker login`). На VPS это /root/.docker/config.json
      - ${HOME}/.docker/config.json:/config.json:ro
    networks:
      - public

  # --- Backend: FastAPI. Только сеть internal, БЕЗ ports — снаружи доступен лишь через nginx /api/ ---
  backend:
    build: ./backend
    image: ${REGISTRY_HOST}:${REGISTRY_PORT}/autello-backend:latest
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Имя сервиса БД во внутренней сети
      POSTGRES_HOST: postgres
      # secure-режим: Swagger выключен (в dev переопределяется на true)
      DOCS_ENABLED: "false"
    volumes:
      # SQL-миграции части 3 применяются при старте (app/core/migrations.py)
      - ./sql:/srv/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Healthcheck описан в backend/Dockerfile: GET /api/health (внутри — SELECT 1 к БД)

  # ===================== Профиль tools: разовые служебные контейнеры =====================

  # Сборка фронтенда, если на машине нет Node.js («npm: command not found» из урока)
  frontend-build:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      # node_modules контейнера (Linux) не смешиваем с node_modules хоста
      - /app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

  # Playwright: e2e-тесты части 3 + скриншоты для сдачи → reports/screens/
  # Запускается в dev-режиме (make e2e): нужны Swagger и порт 80 без редиректа
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: ["tools"]
    working_dir: /e2e
    environment:
      BASE_URL: http://nginx
      BACKEND_URL: http://backend:${BACKEND_INTERNAL_PORT:-8000}
      SCREENS_DIR: /reports/screens
      REPORTS_DIR: /reports
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      DEMO_ADMIN_USER: ${DEMO_ADMIN_USER:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-change_me_demo}
      VISIT_SECONDS: ${VISIT_SECONDS:-150}
      E2E_ARGS: ${E2E_ARGS:-}
      CI: "1"
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
      - ./reports:/reports
    networks:
      - public
    # Аргументы playwright (например, имя spec-файла) — через make e2e E2E_ARGS=...
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && npx playwright test $$E2E_ARGS"]

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  pgadmin-data:
  registry-data:
