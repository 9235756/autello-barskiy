# Конфиг Docker Registry v2.
# Параметры auth и storage.delete дополнительно заданы переменными окружения
# в docker-compose.yml (REGISTRY_AUTH_*, REGISTRY_STORAGE_DELETE_ENABLED) — они имеют приоритет.
version: 0.1
log:
  level: info
  fields:
    service: registry
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory
auth:
  htpasswd:
    realm: Autello Registry
    path: /auth/htpasswd
http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
