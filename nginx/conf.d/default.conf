# Nginx: отдаёт фронт и (в будущем) проксирует /api/ на backend.
server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Не светим версию nginx
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проверка живости для мониторинга / check.sh
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Backend (часть 2). Раскомментировать, когда появится сервис backend
    #     и nginx будет добавлен в сеть internal (см. docker-compose.yml).
    #
    # ВНИМАНИЕ про слэши: location /api/ + proxy_pass http://backend:8000/api/
    # передаёт путь как есть (/api/leads → /api/leads).
    # Если написать proxy_pass http://backend:8000/ (со слэшем без /api/),
    # префикс /api/ будет СРЕЗАН (/api/leads → /leads).
    #
    # location /api/ {
    #     proxy_pass         http://backend:8000/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     client_max_body_size 1m;
    # }
}
